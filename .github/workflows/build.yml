name: Build Android APK
# Final verification build for the completed app

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

# Only one release-producing Android build may run at a time. Rapid commits
# previously let two jobs delete/recreate the same "latest" release concurrently.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Refusing to build a release with a different signing key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Using the fixed signing key from the KEYSTORE_BASE64 secret"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build release APK
        run: gradle assembleRelease

      - name: Zip APK
        run: |
          cd app/build/outputs/apk/release/
          APK_FILE="$(find . -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          mv "$APK_FILE" ibn-awf-Tasp.apk
          zip ibn-awf-Tasp.zip ibn-awf-Tasp.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibn-awf-Tasp
          path: |
            app/build/outputs/apk/release/ibn-awf-Tasp.apk
            app/build/outputs/apk/release/ibn-awf-Tasp.zip

      - name: Remove previous release so only the newest build remains
        if: github.event_name != 'pull_request'
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release with APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "أحدث نسخة"
          files: app/build/outputs/apk/release/ibn-awf-Tasp.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
