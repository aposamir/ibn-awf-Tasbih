plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aposamir.tasbeehapp'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "android"
            keyAlias "tasbeehapp"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.aposamir.tasbeehapp"
        minSdk 21
        targetSdk 34
        // Each CI build gets a higher version number, so phones treat it as an update
        versionCode(Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1"))
        versionName("1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0"))
    }

    lint {
        abortOnError false
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "TasbeehApp-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
}


